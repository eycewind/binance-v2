name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches-ignore:
      - main

permissions:
  contents: read

jobs:
  tests:
    name: tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install test dependencies
        run: python -m pip install --requirement requirements-dev.txt

      - name: Whitespace check against main
        run: |
          git fetch --no-tags --prune --depth=1 origin main
          git diff --check origin/main...HEAD

      - name: Run tests
        env:
          PYTHONPATH: src
        run: pytest -q

  package:
    name: package
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build dependencies
        run: python -m pip install --requirement requirements-dev.txt

      - name: Build package
        run: python -m build --no-isolation

      - name: Verify package import outside checkout
        run: |
          tmpdir="$(mktemp -d)"
          python -m venv "$tmpdir/venv"
          "$tmpdir/venv/bin/python" -m pip install --no-index --find-links dist binance-data-foundation
          cd "$tmpdir"
          "$tmpdir/venv/bin/python" -c "import binance_data_foundation; print(binance_data_foundation.__file__)"
