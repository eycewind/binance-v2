[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "binance-data-foundation"
version = "0.1.0"
requires-python = ">=3.11"
description = "Bounded Binance public-data ingestion, validation, feature, and ledger fixtures."

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
